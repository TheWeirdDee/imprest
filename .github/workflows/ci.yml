name: ci

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - name: Build
        run: cd contracts && forge build
      - name: Test against Perpl exchange bytecode
        run: cd contracts && forge test --no-match-contract TestnetFork
      - name: Reference model gate (independent Python model vs contract outputs)
        run: python -I proof/reference_model/run_reference.py

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r --filter "./packages/*" --filter ./relayer --filter ./keeper --filter ./scripts --filter ./web typecheck
      - name: Unit tests (core, relayer, keeper)
        run: pnpm --filter @imprest/core --filter @imprest/relayer --filter @imprest/keeper test
      - name: Evidence validator
        run: pnpm validate-evidence
      - name: Indexer config validates against Envio schema
        run: cd indexer && node scripts/gen-config.mjs --example && node scripts/validate-config.mjs

  web:
    runs-on: ubuntu-latest
    needs: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter @imprest/web build
        env:
          NEXT_PUBLIC_IMPREST_ENV: testnet
      - name: Browser E2E
        run: |
          pnpm --filter @imprest/web exec playwright install --with-deps chromium
          pnpm --filter @imprest/web e2e
        env:
          NEXT_PUBLIC_IMPREST_ENV: testnet

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No private keys committed
        run: |
          if git ls-files | grep -vE '^(contracts/lib|contracts/perpl-artifacts)/' | xargs grep -nIE '(PRIVATE_KEY|private_key)\s*[=:]\s*"?0x[0-9a-fA-F]{64}' ; then
            echo "private key found in tracked files"; exit 1
          fi
