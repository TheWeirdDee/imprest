# Render Blueprint: hosts the Imprest relayer over HTTPS so the live website can offer gasless
# trading without the owner's PC. Nothing is deployed until the owner connects this repository
# in a Render account (see docs/HOSTING.md). Secrets are entered in Render, never committed.
services:
  - type: web
    name: imprest-relayer
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --filter "@imprest/relayer..."
    startCommand: pnpm --filter @imprest/relayer start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: IMPREST_ENV
        value: testnet
      # Only the live website may use this relayer (it pays gas).
      - key: RELAYER_ALLOWED_ORIGINS
        value: https://imprest-chi.vercel.app
      - key: RELAYER_QUOTA_PER_TRADER_PER_MIN
        value: "5"
      - key: RELAYER_MAX_GAS
        value: "1200000"
      # Entered by the owner in the Render dashboard; never committed.
      - key: RELAYER_PRIVATE_KEY
        sync: false
